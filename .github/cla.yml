name: Contributor License Agreement (CLA)

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write          # allow pushing updates to signatures file
  pull-requests: write     # allow posting PR comments

jobs:
  cla:
    if: github.event.pull_request.draft == false || github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request_target runs on base repo; fetch full history to edit signatures file
          fetch-depth: 0

      - name: Run CLA Assistant
        uses: contributor-assistant/github-action@v2.4.0
        with:
          path-to-document: 'CLA.md'
          path-to-signatures: 'signatures/cla.json'
          branch: 'main'
          # Optional: users/orgs that don’t need to sign:
          # allowlist: 'Digzcod'

      - name: Commit updated signatures (if changed)
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signatures/cla.json
            git commit -m "chore: update CLA signatures [skip ci]"
            git push
          fi
